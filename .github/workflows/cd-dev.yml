# Builds the production image and pushes it to Artifact Registry after CI goes
# green on `main`. Deploying the pushed image is owned by `wave-foundation-iac`,
# not by this workflow. Also builds and pushes the WireMock test double
# (wiremock/Dockerfile.wiremock), per tim-network-adapter ADR 0001.
#
# Requires, on the repository:
#   secrets — GCP_CREDENTIALS
#   vars    — GCP_FOUNDATION_REGION, GCP_FOUNDATION_PROJECT_ID, GAR_REPOSITORY_DEV
# Requires, on each tenant's GitHub Environment (e.g. "tim-dev"):
#   vars    — PACT_BROKER_URL
#   secrets — PACT_BROKER_USERNAME, PACT_BROKER_PASSWORD
#
# Delete this file if the service is not deployed to Google Cloud.
name: CD - Development

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  # Image name in Artifact Registry. `scripts/rename-service.sh` rewrites it.
  SERVICE_NAME: toutbox-carrier-service
  WIREMOCK_IMAGE_NAME: toutbox-carrier-wiremock
  # Pact provider identity — the role wave-delivery-api's consumer contract
  # names, not this repo's own name. Deliberately not SERVICE_NAME: this repo
  # is one possible implementation of that role, not the role itself.
  PACTICIPANT: external-carrier-service

jobs:
  pact-can-i-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        tenant_env: [tim-dev]
    environment: ${{ matrix.tenant_env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Can I deploy to ${{ matrix.tenant_env }}?
        if: vars.PACT_BROKER_URL != ''
        env:
          PACT_BROKER_URL: ${{ vars.PACT_BROKER_URL }}
          PACT_BROKER_USERNAME: ${{ secrets.PACT_BROKER_USERNAME }}
          PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}
        run: |
          npx pact-broker can-i-deploy \
            --pacticipant="${{ env.PACTICIPANT }}" \
            --version="${{ github.sha }}" \
            --to-environment=production \
            --broker-base-url="$PACT_BROKER_URL" \
            --broker-username="$PACT_BROKER_USERNAME" \
            --broker-password="$PACT_BROKER_PASSWORD"

  deploy:
    needs: pact-can-i-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Fails fast on a broken build before spending time on the image build.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ vars.GCP_FOUNDATION_REGION }}-docker.pkg.dev

      - name: Build and push image
        run: |
          IMAGE="${{ vars.GCP_FOUNDATION_REGION }}-docker.pkg.dev/${{ vars.GCP_FOUNDATION_PROJECT_ID }}/${{ vars.GAR_REPOSITORY_DEV }}/${{ env.SERVICE_NAME }}:${{ github.ref_name }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      # Build context is the wiremock/ directory itself, not the repo root.
      - name: Build and push WireMock image
        run: |
          WIREMOCK_IMAGE="${{ vars.GCP_FOUNDATION_REGION }}-docker.pkg.dev/${{ vars.GCP_FOUNDATION_PROJECT_ID }}/${{ vars.GAR_REPOSITORY_DEV }}/${{ env.WIREMOCK_IMAGE_NAME }}:${{ github.ref_name }}"
          docker build -f wiremock/Dockerfile.wiremock -t "$WIREMOCK_IMAGE" ./wiremock
          docker push "$WIREMOCK_IMAGE"

  # Records "deployed" at image-push time, not at actual Cloud Run rollout
  # (a separate, later step owned by wave-foundation-iac).
  pact-record-deployment:
    needs: deploy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tenant_env: [tim-dev]
    environment: ${{ matrix.tenant_env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Record deployment to ${{ matrix.tenant_env }}
        if: vars.PACT_BROKER_URL != ''
        env:
          PACT_BROKER_URL: ${{ vars.PACT_BROKER_URL }}
          PACT_BROKER_USERNAME: ${{ secrets.PACT_BROKER_USERNAME }}
          PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}
        run: |
          npx pact-broker record-deployment \
            --pacticipant="${{ env.PACTICIPANT }}" \
            --version="${{ github.sha }}" \
            --environment=production \
            --broker-base-url="$PACT_BROKER_URL" \
            --broker-username="$PACT_BROKER_USERNAME" \
            --broker-password="$PACT_BROKER_PASSWORD"
