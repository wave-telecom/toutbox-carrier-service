# Builds the production image and pushes it to Artifact Registry after CI goes
# green on `main`. Deploying the pushed image is owned by `wave-foundation-iac`,
# not by this workflow.
#
# Also builds and pushes the WireMock test double (wiremock/Dockerfile.wiremock)
# as its own image, per tim-network-adapter ADR 0001 ("each network adapter
# owns its own CD for this image") — same registry, alongside the application
# image, so wave-foundation-iac has something to deploy for both.
#
# The image build is tenant-agnostic (one image, shared by every tenant that
# enables this module), but the Pact gate around it isn't: each tenant runs
# its own Pact Broker, so `can-i-deploy`/`record-deployment` run once per
# tenant, each against that tenant's own broker via a same-named GitHub
# Environment. Add a tenant to both matrices the same time its Pulumi config
# enables `toutboxCarrier`.
#
# Requires, on the repository:
#   secrets — GCP_CREDENTIALS
#   vars    — GCP_FOUNDATION_REGION, GCP_FOUNDATION_PROJECT_ID, GAR_REPOSITORY_DEV
# Requires, on each tenant's GitHub Environment (e.g. "tim-dev"):
#   vars    — PACT_BROKER_URL
#   secrets — PACT_BROKER_USERNAME, PACT_BROKER_PASSWORD
#
# Delete this file if the service is not deployed to Google Cloud.
name: CD - Development

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  # Image name in Artifact Registry, and this repo's own Pact pacticipant name
  # (the two happen to be the same token here). `scripts/rename-service.sh`
  # rewrites this.
  SERVICE_NAME: toutbox-carrier-service
  # WireMock test double image name — kept distinct from SERVICE_NAME since
  # both live in the same Artifact Registry repository.
  WIREMOCK_IMAGE_NAME: toutbox-carrier-wiremock

jobs:
  pact-can-i-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        tenant_env: [tim-dev]
    environment: ${{ matrix.tenant_env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Refuses to proceed if this exact version hasn't been verified
      # successfully against whatever consumer version is currently live in
      # this tenant's `dev` — the whole reason to publish/verify pacts.
      - name: Can I deploy to ${{ matrix.tenant_env }}?
        run: |
          npx pact-broker can-i-deploy \
            --pacticipant="${{ env.SERVICE_NAME }}" \
            --version="${{ github.sha }}" \
            --to-environment=dev \
            --broker-base-url="${{ vars.PACT_BROKER_URL }}" \
            --broker-username="${{ secrets.PACT_BROKER_USERNAME }}" \
            --broker-password="${{ secrets.PACT_BROKER_PASSWORD }}"

  # Builds and pushes the images once — shared by every tenant, so this does
  # not matrix over tenant_env. Runs only once every tenant's gate above passes.
  deploy:
    needs: pact-can-i-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Fails fast on a broken build before spending time on the image build.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ vars.GCP_FOUNDATION_REGION }}-docker.pkg.dev

      - name: Build and push image
        run: |
          IMAGE="${{ vars.GCP_FOUNDATION_REGION }}-docker.pkg.dev/${{ vars.GCP_FOUNDATION_PROJECT_ID }}/${{ vars.GAR_REPOSITORY_DEV }}/${{ env.SERVICE_NAME }}:${{ github.ref_name }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      # Build context is the wiremock/ directory itself, not the repo root —
      # the image's only inputs are that directory's contents (ADR 0001).
      - name: Build and push WireMock image
        run: |
          WIREMOCK_IMAGE="${{ vars.GCP_FOUNDATION_REGION }}-docker.pkg.dev/${{ vars.GCP_FOUNDATION_PROJECT_ID }}/${{ vars.GAR_REPOSITORY_DEV }}/${{ env.WIREMOCK_IMAGE_NAME }}:${{ github.ref_name }}"
          docker build -f wiremock/Dockerfile.wiremock -t "$WIREMOCK_IMAGE" ./wiremock
          docker push "$WIREMOCK_IMAGE"

  # Approximation: this records the version as "deployed to dev" as soon as
  # both images are pushed, not when wave-foundation-iac's App Dev Deploy
  # actually rolls them out to Cloud Run for that tenant (a separate, later,
  # manually-triggered step owned by that repo) — the gap between the two is
  # normally small for dev. Good enough to give future `can-i-deploy` runs a
  # real baseline; revisit if that gap ever matters (e.g. by moving this call
  # into wave-foundation-iac's update-service-image action instead, right
  # after the actual `gcloud run services update`).
  pact-record-deployment:
    needs: deploy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tenant_env: [tim-dev]
    environment: ${{ matrix.tenant_env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Record deployment to ${{ matrix.tenant_env }}
        run: |
          npx pact-broker record-deployment \
            --pacticipant="${{ env.SERVICE_NAME }}" \
            --version="${{ github.sha }}" \
            --environment=dev \
            --broker-base-url="${{ vars.PACT_BROKER_URL }}" \
            --broker-username="${{ secrets.PACT_BROKER_USERNAME }}" \
            --broker-password="${{ secrets.PACT_BROKER_PASSWORD }}"
