# Publishes @wave-tech/toutbox-carrier to the public npm registry when a
# GitHub release is created. Same OIDC "Trusted Publisher" mechanism
# wave-tech-framework's own npm-publish.yml uses — no NPM_TOKEN/secret
# anywhere: the `id-token: write` permission lets npm publish exchange a
# short-lived GitHub OIDC token for a publish grant, which npmjs.com only
# honors once someone with admin on the @wave-tech org has registered this
# repo + this workflow file as a trusted publisher for this package name on
# npmjs.com — a one-time registry-side setup step, not a GitHub setting.
# node-version must stay >= the first npm CLI release with trusted-publisher
# support (npm 11.5.1); Node 22's bundled npm (10.x) predates it, hence 24
# here even though the package itself only requires Node >=22 at runtime.
name: Publish package

on:
  release:
    types: [created]

permissions:
  id-token: write # required for OIDC trusted publishing
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --provenance
