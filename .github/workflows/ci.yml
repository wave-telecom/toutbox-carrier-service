name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required to mint the OIDC token for the coverage API
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # `npm ci` (not `npm install`): installs exactly the committed lockfile, so
      # CI resolves the same dependency tree as the Docker image build.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # PACT_BROKER_URL gates pact-provider-verification.pact.test.ts (it skips
      # itself when unset, per ADR 0000) — setting it here is what turns the
      # verification against wave-delivery-api's consumer contract on in CI.
      # publishVerificationResult in that test is already gated on `CI === 'true'`,
      # which GitHub Actions sets by default, so results get recorded automatically.
      - name: Test with coverage
        run: npm run test:coverage
        env:
          PACT_BROKER_URL: ${{ vars.PACT_BROKER_URL }}
          PACT_BROKER_USERNAME: ${{ secrets.PACT_BROKER_USERNAME }}
          PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}

      - name: Publish coverage report
        if: always()
        uses: wave-telecom/wave-github-actions/actions/vitest-coverage-report@main
        with:
          api-url: https://tide.bemobiwave.com/api/coverage
          audience: https://github.com/wave-telecom
          fail-on-error: 'false'
          label: unit
